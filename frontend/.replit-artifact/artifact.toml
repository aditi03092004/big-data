kind = "web"
previewPath = "/"
title = "E-Commerce Big Data Analytics"
description = "A professional internal analytics platform for exploring e-commerce KPIs, customer, product, order, revenue, live event, dataset, query, report, and Big Data infrastructure health insights in Demo Mode with integration points for HDFS, Spark, Hive, Kafka, and MongoDB."
version = "1.0.0"
id = "artifacts/ecommerce-bigdata-analytics"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20559

[services.development]
run = "pnpm --filter @workspace/ecommerce-bigdata-analytics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecommerce-bigdata-analytics", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecommerce-bigdata-analytics/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20559"
BASE_PATH = "/"
